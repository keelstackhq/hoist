[package]
name = "keel-hoist"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
description = "Provision and verify a repo's GitHub and Cloudflare setup from what the repo already says"
license = "MIT"
repository = "https://github.com/keelstackhq/hoist"
# Only what builds the crate: no tests, fixtures, npm packages or docs in the .crate file.
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md"]

[lib]
name = "hoist"
path = "src/lib.rs"

[[bin]]
name = "hoist"
path = "src/main.rs"

[dependencies]
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
crypto_box = { version = "=0.9.1", default-features = false, features = ["seal", "salsa20", "getrandom", "std"] }
jsonc-parser = { version = "=0.34.0", features = ["serde"] }
regex = "=1.13.1"
ring = "=0.17.14"
rpassword = "=7.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
toml = "=1.1.8"
toml_edit = "=0.25.17"
ureq = { version = "=3.4.2", features = ["platform-verifier"] }
yaml_serde = "=0.10.7"
zeroize = "=1.9.1"

# `secrets exec` (unix only): process groups, PR_SET_DUMPABLE and signals (spec §15.7).
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["process"] }
signal-hook = { version = "=0.4.5", default-features = false }

[dev-dependencies]
assert_cmd = "=2.2.2"
insta = { version = "=1.49.0", features = ["json"] }
predicates = "=3.1.4"
tempfile = "=3.27.0"
tiny_http = "=0.12.0"
