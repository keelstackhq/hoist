[package]
name = "keel-hoist"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
description = "Provision and verify a repo's GitHub and Cloudflare setup from what the repo already says"
license = "MIT"
repository = "https://github.com/keelstackhq/hoist"

[lib]
name = "hoist"
path = "src/lib.rs"

[[bin]]
name = "hoist"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
jsonc-parser = { version = "=0.34.0", features = ["serde"] }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
toml = "=1.1.8"
ureq = "=3.4.2"
yaml_serde = "=0.10.7"

[dev-dependencies]
assert_cmd = "=2.2.2"
insta = { version = "=1.49.0", features = ["json"] }
predicates = "=3.1.4"
tempfile = "=3.27.0"
tiny_http = "=0.12.0"
