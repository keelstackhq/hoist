# keelstackhq/hoist/secrets: run a command with secrets from secrets repos (design spec §15.8).
# Pin it by full commit SHA of a hoist release tag: `uses: keelstackhq/hoist/secrets@<sha> # vX.Y.Z`.
# It runs the hoist release named by the version in this commit's Cargo.toml.
name: hoist secrets
description: Run a command with the secrets.toml values of one environment (hoist secrets exec).
inputs:
  env:
    description: The [env.<E>] table of secrets.toml; also the job's `environment:`.
    required: true
  keys:
    description: The keys of that table to pass, comma-separated; nothing else is fetched.
    required: true
  run:
    description: The command, run by `bash -eo pipefail -c` in the workspace.
    required: true
  app-id:
    description: The secrets-read GitHub App's id (vars.SECRETS_READ_APP_ID).
    required: true
  app-key:
    description: The secrets-read GitHub App's private key (secrets.SECRETS_READ_APP_KEY).
    required: true
  age-key:
    description: The environment's age key (secrets.SOPS_AGE_KEY).
    required: true
  workflow-run-path:
    description: >-
      For a workflow_run job: the workflow file that may trigger it
      (.github/workflows/<name>.yml); hoist refuses a workflow_run without it.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install sops and hoist
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            sops_arch=amd64 pkg=hoist-linux-x64
            sops_sha=e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b ;;
          Linux/ARM64)
            sops_arch=arm64 pkg=hoist-linux-arm64
            sops_sha=53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77 ;;
          *) echo "::error::hoist secrets runs on Linux x64 or arm64 runners only"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/hoist-secrets"
        mkdir -p "$dir/bin" && cd "$dir"
        # sops 3.13.3, SHA-256 checked (amd64 as in hoist's CI, arm64 from sops' checksums file).
        curl -fsSLo sops "https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.$sops_arch"
        echo "$sops_sha  sops" | sha256sum -c - > /dev/null
        # hoist: the release of this commit's version, from its public npm platform package. This
        # trusts npm and the @keelstackhq publishers (no provenance: the repo is private); the
        # sha512 check guards the download, and npm never reuses a version number.
        version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$ACTION_PATH/../Cargo.toml" | head -n 1)
        if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::cannot read hoist's version from the action's Cargo.toml"; exit 1
        fi
        meta=$(curl -fsSL "https://registry.npmjs.org/@keelstackhq%2f$pkg/$version") || {
          echo "::error::@keelstackhq/$pkg@$version is not on npm (pin a published release tag)"; exit 1
        }
        tarball=$(jq -r '.dist.tarball' <<< "$meta")
        integrity=$(jq -r '.dist.integrity' <<< "$meta")
        if [ "$tarball" != "https://registry.npmjs.org/@keelstackhq/$pkg/-/$pkg-$version.tgz" ] ||
          [[ $integrity != sha512-* ]]; then
          echo "::error::unexpected npm metadata for @keelstackhq/$pkg@$version"; exit 1
        fi
        curl -fsSLo hoist.tgz "$tarball"
        if [ "sha512-$(openssl dgst -sha512 -binary hoist.tgz | base64 -w 0)" != "$integrity" ]; then
          echo "::error::@keelstackhq/$pkg@$version does not match its npm integrity"; exit 1
        fi
        tar -xzf hoist.tgz package/bin/hoist
        install -m 0755 sops package/bin/hoist "$dir/bin/"
        rm -rf hoist.tgz package sops
        "$dir/bin/hoist" --version
        echo "dir=$dir/bin" >> "$GITHUB_OUTPUT"
    - name: Run with secrets
      shell: bash
      env:
        HOIST_BIN_DIR: ${{ steps.install.outputs.dir }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_KEYS: ${{ inputs.keys }}
        INPUT_RUN: ${{ inputs.run }}
        INPUT_WORKFLOW_RUN_PATH: ${{ inputs.workflow-run-path }}
        # hoist mints its own token from the App (contents: read on the sources only) and
        # removes these three from the command's environment.
        SECRETS_READ_APP_ID: ${{ inputs.app-id }}
        SECRETS_READ_APP_KEY: ${{ inputs.app-key }}
        SOPS_AGE_KEY: ${{ inputs.age-key }}
        # A job-level token would be used as-is: empty means unset, so hoist always mints.
        HOIST_SECRETS_TOKEN: ""
      run: |
        set -euo pipefail
        args=(secrets exec --env "$INPUT_ENV" --keys "$INPUT_KEYS")
        if [ -n "$INPUT_WORKFLOW_RUN_PATH" ]; then
          args+=(--workflow-run-path "$INPUT_WORKFLOW_RUN_PATH")
        fi
        # sops is found on PATH (absolute entries only); the command gets the same PATH.
        PATH="$HOIST_BIN_DIR:$PATH" exec "$HOIST_BIN_DIR/hoist" "${args[@]}" -- bash -eo pipefail -c "$INPUT_RUN"
