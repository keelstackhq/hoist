name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      # sops and age for the secrets tests (spec §15.9.1): pinned releases, SHA-256 checked, and
      # age's tarball checked against its Sigsum proof (signature, log inclusion, cosignatures).
      - name: Install sops 3.13.3 and age 1.3.2
        env:
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/secrets-tools" && mkdir -p "$dir/bin" && cd "$dir"
          curl -fsSLo sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "$SOPS_SHA256  sops" | sha256sum -c -
          age=age-v1.3.2-linux-amd64.tar.gz
          curl -fsSLO "https://github.com/FiloSottile/age/releases/download/v1.3.2/$age"
          curl -fsSLO "https://github.com/FiloSottile/age/releases/download/v1.3.2/$age.proof"
          echo "$AGE_SHA256  $age" | sha256sum -c -
          # age's Sigsum keys, from SIGSUM.md in the age repo at v1.3.2.
          printf '%s\n' \
            "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM1WpnEswJLPzvXJDiswowy48U+G+G1kmgwUE2eaRHZG" \
            "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAz2WM5CyPLqiNjk7CLl4roDXwKhQ0QExXLebukZEZFS" \
            > age-sigsum-key.pub
          GOBIN="$dir/tools" go install sigsum.org/sigsum-go/cmd/sigsum-verify@v0.13.1
          "$dir/tools/sigsum-verify" -k age-sigsum-key.pub -P sigsum-generic-2025-1 "$age.proof" < "$age"
          tar -xzf "$age"
          install -m 0755 sops age/age age/age-keygen "$dir/bin/"
          echo "$dir/bin" >> "$GITHUB_PATH"
      - run: sops --version --disable-version-check && age --version && age-keygen --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The install test packs the npm packages with the binary `cargo test` built and runs it
      # through the installed launcher (offline, no registry).
      - run: node --test npm/hoist/test/*.test.js
        env:
          HOIST_E2E_BIN: target/debug/hoist

  # One stable required check for branch protection, the same name as in the other keelstackhq
  # repos: it fails unless every job above succeeded (also when one was skipped or cancelled).
  ci-ok:
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs succeeded
        run: |
          echo "ci: ${{ needs.ci.result }}"
          test "${{ needs.ci.result }}" = "success"
