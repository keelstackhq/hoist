name: release

# hoist releases itself with `hoist release` (spec §9, §12), built from source in this run:
# - detect: is the version in Cargo.toml pending (no tag `v<version>`, or the tag is on HEAD)?
# - build + publish (pending only): binaries for 5 targets, then tags, the GitHub Release, npm
#   (launcher + platform packages) and crates.io via trusted publishing in env `release`.
# - prepare: open, update or close the release PR (branch hoist/release); after publish when
#   that ran, so the new tag is seen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.version.outputs.pending }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: version
        # The same rule as `hoist release publish` (R19): pending when the manifest version has
        # no tag, or its tag points at HEAD (a re-run of this release).
        run: |
          version=$(awk -F'"' '/^\[/ { s = ($0 == "[package]") } s && /^version *=/ { print $2; exit }' Cargo.toml)
          tag="v$version"
          if sha=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            if [ "$sha" = "$(git rev-parse HEAD)" ]; then pending=true; else pending=false; fi
          else
            pending=true
          fi
          echo "version $version, tag $tag, pending $pending"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.pending == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # ring and other C code need the musl C compiler on the musl targets.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - name: Rename the binary to hoist-<target>
        shell: bash
        run: |
          ext=""
          case "${{ matrix.target }}" in *-windows-*) ext=".exe" ;; esac
          mkdir -p out
          cp "target/${{ matrix.target }}/release/hoist$ext" "out/hoist-${{ matrix.target }}$ext"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hoist-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.pending == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # `cargo publish` builds the crate; it runs without GH_TOKEN (R27).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # npm >= 11.5.1 and Node >= 22.14.0 do the OIDC exchange for trusted publishing.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm install -g npm@12.2.0
      # dist/ is in .gitignore, so it neither dirties the tree nor ends up in the crate.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hoist-*
          path: dist
          merge-multiple: true
      # Run the linux-x64 binary this release ships, from dist/: nothing is compiled in a
      # step that holds GH_TOKEN.
      - run: |
          chmod +x dist/hoist-x86_64-unknown-linux-musl
          dist/hoist-x86_64-unknown-linux-musl release publish --assets dist
        env:
          GH_TOKEN: ${{ github.token }}

  prepare:
    needs: [detect, publish]
    if: ${{ !cancelled() && (needs.detect.outputs.pending == 'false' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A PR pushed with the default GITHUB_TOKEN runs no checks; the optional secret
      # HOIST_RELEASE_TOKEN (Contents and Pull requests: write) makes the release PR run CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.HOIST_RELEASE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # prepare runs `pnpm install --lockfile-only` when the npm launcher's version changes.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.14.0
      # Build in a step without GH_TOKEN; only the built binary sees it.
      - run: cargo build --release --locked
      # Exit 2 means the PR is open but a human step is pending (the release token secret):
      # a warning, not a failed run.
      - run: |
          rc=0
          target/release/hoist release prepare || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::release PR opened without a release token; it runs no checks. Create HOIST_RELEASE_TOKEN or the App secrets."
            exit 0
          fi
          exit "$rc"
        env:
          GH_TOKEN: ${{ secrets.HOIST_RELEASE_TOKEN || github.token }}
          # hoist opens the PR with the first of these that is set, so it runs checks.
          HOIST_RELEASE_TOKEN: ${{ secrets.HOIST_RELEASE_TOKEN }}
          HOIST_RELEASE_APP_ID: ${{ vars.HOIST_RELEASE_APP_ID }}
          HOIST_RELEASE_APP_KEY: ${{ secrets.HOIST_RELEASE_APP_KEY }}
